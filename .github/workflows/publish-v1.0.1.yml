name: Publish SchemaWeave v1.0.1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v1.0.1.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      - name: Build installable WordPress plugin
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build dist
          mkdir -p build/schemaweave/includes/SchemaWeave dist
          cp schemaweave.php uninstall.php readme.txt LICENSE CHANGELOG.md build/schemaweave/
          cp -R assets build/schemaweave/assets
          cp -R docs build/schemaweave/docs
          rsync -a --exclude='SchemaWeave' includes/ build/schemaweave/includes/
          cp -R includes/SchemaWeave/src/. build/schemaweave/includes/SchemaWeave/
          cp includes/SchemaWeave/LICENSE build/schemaweave/includes/SchemaWeave/LICENSE
          find build/schemaweave -name '*.php' -print0 | xargs -0 -n1 php -l
          grep -q 'Version: 1.0.1' build/schemaweave/schemaweave.php
          grep -q 'Stable tag: 1.0.1' build/schemaweave/readme.txt
          grep -q 'Tested up to: 7.1' build/schemaweave/readme.txt
          grep -q 'License: GPLv2 or later' build/schemaweave/schemaweave.php
          (cd build && zip -qr ../dist/schemaweave-1.0.1.zip schemaweave)
          unzip -t dist/schemaweave-1.0.1.zip
          (cd dist && sha256sum schemaweave-1.0.1.zip > SHA256SUMS.txt)

      - name: Write release notes
        shell: bash
        run: |
          cat > dist/RELEASE_NOTES.md <<'EOF'
          # SchemaWeave v1.0.1

          WordPress.org submission-readiness and compliance update.

          ## Changes
          - Passed the official WordPress Plugin Check with no errors.
          - Improved nonce verification and request sanitization.
          - Hardened output handling for JSON and JSON-LD responses.
          - Added missing internationalization translator context.
          - Reworked uninstall cleanup to use WordPress metadata APIs.
          - Updated compatibility metadata for WordPress 7.1.
          - Preserved existing schema generation behavior and data-integrity rules.

          ## Requirements
          - WordPress 5.8+
          - PHP 7.4+
          - WooCommerce optional
          EOF

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: c3979a339a6026e7f6e78cc83d0a1a09a0efd62d
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.0.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release v1.0.1 already exists.'
          else
            gh release create v1.0.1 \
              dist/schemaweave-1.0.1.zip \
              dist/SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" \
              --target "$TARGET_SHA" \
              --title 'SchemaWeave v1.0.1' \
              --notes-file dist/RELEASE_NOTES.md
          fi

      - name: Verify published release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_URL="$(gh release view v1.0.1 --repo "$GITHUB_REPOSITORY" --json url --jq .url)"
          printf 'SchemaWeave v1.0.1 published\n%s\n' "$RELEASE_URL" > /tmp/release-status.txt
          CONTENT="$(base64 -w0 /tmp/release-status.txt)"
          EXISTING_SHA="$(gh api "repos/$GITHUB_REPOSITORY/contents/.github/release-status-v1.0.1.txt" --jq .sha 2>/dev/null || true)"
          if [ -n "$EXISTING_SHA" ]; then
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/.github/release-status-v1.0.1.txt" -f message='Record SchemaWeave v1.0.1 release status' -f content="$CONTENT" -f sha="$EXISTING_SHA" >/dev/null
          else
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/.github/release-status-v1.0.1.txt" -f message='Record SchemaWeave v1.0.1 release status' -f content="$CONTENT" >/dev/null
          fi
