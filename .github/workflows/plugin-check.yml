name: WordPress Plugin Check

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/plugin-check.yml'
  pull_request:

permissions:
  contents: write

jobs:
  plugin-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build WordPress.org submission directory
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build
          mkdir -p build/schemaweave/includes/SchemaWeave

          cp schemaweave.php build/schemaweave/
          cp uninstall.php build/schemaweave/
          cp readme.txt build/schemaweave/
          cp LICENSE build/schemaweave/
          cp CHANGELOG.md build/schemaweave/
          cp PRIVACY.md build/schemaweave/
          cp -R assets build/schemaweave/assets
          cp -R docs build/schemaweave/docs

          rsync -a --exclude='SchemaWeave' includes/ build/schemaweave/includes/
          cp -R includes/SchemaWeave/src/. build/schemaweave/includes/SchemaWeave/
          cp includes/SchemaWeave/LICENSE build/schemaweave/includes/SchemaWeave/LICENSE

      - name: Run official Plugin Check
        id: plugincheck
        continue-on-error: true
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: './build/schemaweave'
          slug: 'schemaweave'

      - name: Record Plugin Check diagnostics
        if: always()
        uses: actions/github-script@v7
        env:
          PLUGIN_CHECK_OUTCOME: ${{ steps.plugincheck.outcome }}
          RESULTS_PATH: ${{ runner.temp }}/plugin-check-results.txt
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const statusPath = '.github/plugin-check-status.txt';
            const resultsPath = '.github/plugin-check-results.txt';
            const statusText = `WordPress Plugin Check\noutcome=${process.env.PLUGIN_CHECK_OUTCOME}\n`;
            let resultsText = 'Plugin Check results file was not generated.\n';
            if (fs.existsSync(process.env.RESULTS_PATH)) {
              resultsText = fs.readFileSync(process.env.RESULTS_PATH, 'utf8');
              if (resultsText.length > 60000) resultsText = resultsText.slice(0, 60000);
            }

            async function upsert(path, text, message) {
              let sha;
              try {
                sha = (await github.rest.repos.getContent({ owner, repo, path })).data.sha;
              } catch (error) {
                if (error.status !== 404) throw error;
              }
              await github.rest.repos.createOrUpdateFileContents({
                owner,
                repo,
                path,
                message,
                content: Buffer.from(text).toString('base64'),
                ...(sha ? { sha } : {})
              });
            }

            await upsert(statusPath, statusText, 'Record WordPress Plugin Check status');
            await upsert(resultsPath, resultsText, 'Record WordPress Plugin Check diagnostics');
